<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.25)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.1)" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON EMBLEM BADGE -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#badgeBg)" stroke="#10b981" stroke-width="6" />
    <!-- Stylized Zync Lightning Controller Icon -->
    <path d="M 30 28 L 74 28 L 40 54 L 68 54 L 28 88 L 44 62 L 30 62 Z" fill="url(#emeraldGrad)" filter="url(#neonGlow)" />
  </g>

  <!-- TYPOGRAPHY LOGO TEXT -->
  <g transform="translate(130, 72)">
    <!-- GAME TEXT (WHITE) -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="3" fill="#ffffff">GAME</text>
    <!-- ZYNC TEXT (EMERALD-CYAN GRADIENT) -->
    <text x="165" y="0" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="3" fill="url(#emeraldGrad)" filter="url(#neonGlow)">ZYNC</text>
  </g>

  <!-- SUBTITLE TAG -->
  <g transform="translate(132, 98)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="6" fill="#10b981" opacity="0.95">PC GAMING PLATFORM</text>
  </g>
</svg>
