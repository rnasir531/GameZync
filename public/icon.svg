<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Badge -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#10b981" stroke-width="14" />
  
  <!-- GameZync Stylized G -->
  <path d="M 330,180 A 120,120 0 1,0 330,332 L 250,332 L 250,260 L 330,260" 
        fill="none" 
        stroke="url(#gzGrad)" 
        stroke-width="52" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Sync Lightning Spark -->
  <polygon points="360,130 310,230 350,230 300,340 380,210 340,210" fill="#06b6d4" />
</svg>
